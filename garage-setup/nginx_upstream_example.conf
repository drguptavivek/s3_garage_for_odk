upstream garage_s3 {
    server 127.0.0.1:3900;
}

# S3 Main Endpoint (path-style and fallback)
server {
    listen 443 ssl http2;
    server_name s3.domain.tld;

    # SSL configuration (example using Let's Encrypt paths)
    # ssl_certificate /etc/letsencrypt/live/s3.domain.tld/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s3.domain.tld/privkey.pem;

    client_max_body_size 0; # Disable body size limit for large uploads

    location / {
        proxy_pass http://garage_s3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to avoid disk I/O on the proxy for large files
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# S3 Bucket Virtual Hosts (bucket-name.s3.domain.tld)
server {
    listen 443 ssl http2;
    server_name *.s3.domain.tld;

    # SSL configuration (example using wildcard cert or similar)
    # ssl_certificate /etc/letsencrypt/live/s3.domain.tld/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s3.domain.tld/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://garage_s3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
